<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>وهاد | بين اللحظة وحلاها</title>
<meta name="description" content="اطلبي حلويات وهاد من ذا شفز أو جاهز أو هنقرستيشن.">
<meta name="theme-color" content="#4a342d">
<meta property="og:title" content="وهاد | بين اللحظة وحلاها">
<meta property="og:description" content="اطلبي حلويات وهاد من ذا شفز أو جاهز أو هنقرستيشن.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="preload" as="image" href="assets/cover.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=El+Messiri:wght@600;700&display=swap">
<style>
  :root {
    --rose: #9b4a45;
    --wine: #5a2a27;
    --ivory: #f7efe9;
    --photo-base: #6b4f45;

    /* غامق بما يكفي إن الكلام الأبيض يفضل مقروء حتى لو الزرار جه فوق جزء فاتح من الصورة */
    --glass-bg: rgba(30, 20, 17, 0.58);
    --glass-bg-hover: rgba(30, 20, 17, 0.68);
    --glass-border: rgba(255, 255, 255, 0.30);
    --glass-blur: blur(16px) saturate(150%);

    --text: #ffffff;
    --text-soft: rgba(255, 255, 255, 0.82);
    --text-shadow: 0 1px 12px rgba(0, 0, 0, 0.45);
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.22);

    --radius-btn: 22px;
    --ease: cubic-bezier(.2, .8, .2, 1);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100vh;
    font-family: "Cairo", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--text);
    background: var(--photo-base);
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  img { display: block; }
  button { font: inherit; color: inherit; }

  /* ---------- الخلفية ---------- */
  /* على الشاشات العريضة: نفس الصورة مغبّشة حوالين الكارت */
  .backdrop {
    position: fixed; inset: -48px; z-index: 0;
    background: var(--photo-base) url(assets/cover.webp) center / cover no-repeat;
    filter: blur(30px) brightness(.82);
    transform: scale(1.08);
  }

  .stage {
    position: relative; z-index: 1;
    width: 100%; max-width: 460px;
    min-height: 100vh;
    min-height: 100svh;
    margin: 0 auto;
    display: flex; flex-direction: column;
    overflow: hidden;
    isolation: isolate;
  }
  /* الصورة بألوانها الطبيعية */
  .stage-photo {
    position: absolute; inset: 0; z-index: -2;
    width: 100%; height: 100%;
    object-fit: cover; object-position: 50% 28%;
  }
  /* تدرّج محايد خفيف فوق وتحت بس، عشان الكلام يتقري من غير ما يغيّر لون الصورة */
  .stage::after {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background:
      linear-gradient(to bottom, rgba(0,0,0,.42) 0%, rgba(0,0,0,.12) 18%, rgba(0,0,0,0) 32%),
      linear-gradient(to top, rgba(0,0,0,.55) 0%, rgba(0,0,0,.18) 34%, rgba(0,0,0,0) 52%);
    pointer-events: none;
  }

  /* ---------- الهيدر ---------- */
  .top {
    display: flex; flex-direction: column; align-items: center;
    padding: calc(env(safe-area-inset-top) + 20px) 24px 0;
    text-align: center;
  }
  .logo {
    width: 88px; height: 64px;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(247, 239, 233, .86);
    border: 1px solid rgba(255,255,255,.7);
    box-shadow: var(--shadow);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .logo img { width: 100%; height: 100%; object-fit: contain; mix-blend-mode: multiply; }
  h1 {
    margin-top: 12px;
    font-family: "El Messiri", "Cairo", serif;
    font-size: clamp(28px, 8vw, 36px);
    font-weight: 700;
    line-height: 1.3;
    letter-spacing: 0;
    text-shadow: var(--text-shadow);
  }
  .tagline {
    margin-top: 4px;
    font-size: 15px; font-weight: 600;
    color: var(--text-soft);
    text-shadow: var(--text-shadow);
  }

  /* الزراير تحت العنوان على طول، والمسافة الفاضية بعدها بتنزّل المشاركة والخصوصية لآخر الصفحة */
  .spacer { flex: 1 1 auto; min-height: 24px; }

  /* ---------- زراير الطلب ---------- */
  .order { margin-top: 20px; }
  .links {
    list-style: none;
    display: grid; gap: 12px;
    padding: 0 16px;
  }
  .btn {
    position: relative;
    display: flex; align-items: center; gap: 12px;
    min-height: 68px;
    padding: 10px 10px 10px 12px;
    border-radius: var(--radius-btn);
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.18);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    color: var(--text);
    text-decoration: none;
    transition: background .2s var(--ease), transform .2s var(--ease), border-color .2s var(--ease);
  }
  .btn:hover { background: var(--glass-bg-hover); border-color: rgba(255,255,255,.42); }
  .btn:active { transform: scale(.98); }
  .btn:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }

  .app-icon {
    width: 46px; height: 46px; flex-shrink: 0;
    border-radius: 14px;
    overflow: hidden;
    background: #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,.25);
  }
  .app-icon img { width: 100%; height: 100%; object-fit: cover; }

  .btn-text { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
  .btn-name { font-size: 17px; font-weight: 800; text-shadow: 0 1px 6px rgba(0,0,0,.3); }
  .btn-en { font-size: 12px; font-weight: 600; color: var(--text-soft); direction: ltr; text-align: right; }

  .btn-cta {
    display: inline-flex; align-items: center; gap: 6px;
    flex-shrink: 0;
    height: 40px;
    padding: 0 12px 0 14px;
    white-space: nowrap;
    border-radius: 999px;
    background: var(--ivory);
    color: var(--wine);
    font-size: 14px; font-weight: 800;
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
  }
  .btn-cta svg { width: 16px; height: 16px; transition: transform .2s var(--ease); }
  .btn:hover .btn-cta svg { transform: translateX(-3px); }

  /* ---------- الفوتر ---------- */
  .bottom {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 16px 20px calc(env(safe-area-inset-bottom) + 20px);
  }
  .share {
    display: inline-flex; align-items: center; gap: 8px;
    min-height: 44px;
    padding: 0 18px;
    border-radius: 999px;
    border: 1px solid var(--glass-border);
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    font-size: 14px; font-weight: 700;
    cursor: pointer;
    transition: background .2s var(--ease);
  }
  .share:hover { background: var(--glass-bg-hover); }
  .share:focus-visible, .privacy:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  .share svg { width: 17px; height: 17px; }
  .privacy {
    min-height: 44px;
    background: none; border: 0;
    font-size: 12px;
    color: var(--text-soft);
    text-decoration: underline; text-underline-offset: 4px;
    text-shadow: var(--text-shadow);
    cursor: pointer;
  }

  /* ---------- رسالة سريعة ---------- */
  .toast {
    position: fixed; left: 50%; z-index: 60;
    bottom: calc(env(safe-area-inset-bottom) + 24px);
    transform: translate(-50%, 12px);
    padding: 10px 20px;
    border-radius: 999px;
    background: rgba(28, 20, 18, .88);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    font-size: 14px; font-weight: 600;
    white-space: nowrap;
    opacity: 0; pointer-events: none;
    transition: opacity .25s var(--ease), transform .25s var(--ease);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- نافذة الخصوصية ---------- */
  .sheet {
    position: fixed; inset: 0; z-index: 50;
    display: flex; align-items: flex-end; justify-content: center;
    padding: 12px;
  }
  .sheet[hidden] { display: none; }
  .sheet-scrim {
    position: absolute; inset: 0; border: 0; cursor: pointer;
    background: rgba(0,0,0,.42);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: fade .2s var(--ease);
  }
  .sheet-card {
    position: relative;
    width: 100%; max-width: 420px;
    padding: 24px 22px calc(env(safe-area-inset-bottom) + 20px);
    border-radius: 26px;
    background: var(--ivory);
    color: var(--wine);
    box-shadow: 0 24px 60px rgba(0,0,0,.35);
    animation: rise .28s var(--ease);
  }
  .sheet-card h2 { font: 700 20px/1.4 "El Messiri", "Cairo", serif; }
  .sheet-card p { margin-top: 8px; font-size: 14px; line-height: 1.85; color: var(--rose); }
  .sheet-card .current { font-size: 12px; opacity: .8; }
  .sheet-actions { display: grid; gap: 10px; margin-top: 20px; }
  .sheet-actions button {
    min-height: 48px; border-radius: 999px;
    font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .sheet-actions .primary { background: var(--rose); color: var(--ivory); border: 0; }
  .sheet-actions .secondary { background: transparent; color: var(--rose); border: 1px solid rgba(155,74,69,.35); }
  .sheet-actions button:focus-visible { outline: 2px solid var(--wine); outline-offset: 2px; }

  /* ---------- دخول ناعم ---------- */
  /* قصيرة عشان الزراير تبان في أقل من نص ثانية */
  .reveal { animation: rise .4s var(--ease) both; }
  .links li { animation: rise .35s var(--ease) both; }
  .links li:nth-child(1) { animation-delay: .05s; }
  .links li:nth-child(2) { animation-delay: .09s; }
  .links li:nth-child(3) { animation-delay: .13s; }
  .bottom { animation: fade .4s .2s var(--ease) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

  /* ---------- مقاسات ---------- */
  @media (max-height: 700px) {
    .top { padding-top: calc(env(safe-area-inset-top) + 14px); }
    .logo { width: 76px; height: 56px; }
    h1 { font-size: 27px; margin-top: 8px; }
    .order { margin-top: 14px; }
    .links { gap: 10px; }
    .btn { min-height: 62px; padding-block: 8px; }
    .app-icon { width: 42px; height: 42px; border-radius: 12px; }
  }
  /* موبايلات ضيقة: نصغّر المسافات بدل ما نخبّي "اطلبي الآن" */
  @media (max-width: 360px) {
    .links { padding: 0 12px; }
    .btn { gap: 10px; padding-inline: 8px 10px; }
    .btn-name { font-size: 16px; }
    .btn-cta { padding: 0 10px 0 12px; font-size: 13px; gap: 4px; }
    .btn-cta svg { width: 14px; height: 14px; }
  }
  @media (min-width: 600px) {
    .stage {
      margin: 28px auto;
      min-height: min(860px, calc(100vh - 56px));
      border-radius: 34px;
      box-shadow: 0 30px 90px rgba(0,0,0,.4);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  /* لو المتصفح مش بيدعم البلور، نخلي الزجاج أغمق شوية عشان الكلام يفضل مقروء */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    :root { --glass-bg: rgba(38, 26, 22, .62); --glass-bg-hover: rgba(38, 26, 22, .72); }
  }
</style>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>

  <main class="stage">
    <img class="stage-photo" src="assets/cover.webp" alt="" fetchpriority="high">

    <header class="top reveal">
      <div class="logo"><img src="assets/logo.png" alt="وهاد" width="112" height="88"></div>
      <h1>بين اللحظة وحلاها</h1>
      <p class="tagline" id="order-label">اطلبي من منصتك المفضلة</p>
    </header>

    <nav class="order" aria-labelledby="order-label">
      <ul class="links">
        <li>
          <a class="btn" data-name="thechefz" href="https://thechefzco.app.link/C7nvD7wGv0b" target="_blank" rel="noopener noreferrer">
            <span class="app-icon"><img src="assets/chefz.jpg" alt="" width="46" height="46"></span>
            <span class="btn-text"><span class="btn-name">ذا شفز</span><span class="btn-en">The Chefz</span></span>
            <span class="btn-cta" aria-hidden="true"><span>اطلبي الآن</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></span>
          </a>
        </li>
        <li>
          <a class="btn" data-name="jahez" href="https://jahez.go.link/4mC6d" target="_blank" rel="noopener noreferrer">
            <span class="app-icon"><img src="assets/jahez.jpg" alt="" width="46" height="46"></span>
            <span class="btn-text"><span class="btn-name">جاهز</span><span class="btn-en">Jahez</span></span>
            <span class="btn-cta" aria-hidden="true"><span>اطلبي الآن</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></span>
          </a>
        </li>
        <li>
          <a class="btn" data-name="hungerstation" href="https://hungerstation.go.link/?c=SA&amp;s=c&amp;v=97396&amp;so=mls&amp;adj_t=1sdhhuza_1spi9ypp&amp;adj_og_title=%D9%88%D9%87%D8%A7%D8%AF&amp;adj_og_image=https://images.deliveryhero.io/image/hungerstation/restaurant/logo_ar/9bf5371fc67cd2d17d1e90c537366c47.PNG" target="_blank" rel="noopener noreferrer">
            <span class="app-icon"><img src="assets/hungerstation.jpg" alt="" width="46" height="46"></span>
            <span class="btn-text"><span class="btn-name">هنقرستيشن</span><span class="btn-en">HungerStation</span></span>
            <span class="btn-cta" aria-hidden="true"><span>اطلبي الآن</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></span>
          </a>
        </li>
      </ul>
    </nav>

    <div class="spacer"></div>

    <footer class="bottom">
      <button class="share" type="button" id="share">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
        مشاركة الصفحة
      </button>
      <button class="privacy" type="button" id="privacy-open">الخصوصية والقياس</button>
    </footer>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <button class="sheet-scrim" type="button" aria-label="إغلاق" id="sheet-close"></button>
    <div class="sheet-card">
      <h2 id="sheet-title">إعدادات الخصوصية والقياس</h2>
      <p>روابط الطلب تعمل دائمًا ولا تحتاج أي موافقة. قياس الزيارات والنقرات اختياري تمامًا، ويساعدنا فقط على معرفة المنصات الأكثر استخدامًا.</p>
      <p class="current" id="sheet-current" hidden></p>
      <div class="sheet-actions">
        <button class="primary" type="button" data-choice="granted">السماح بالقياس</button>
        <button class="secondary" type="button" data-choice="denied">الضروري فقط</button>
      </div>
    </div>
  </div>

<script>
  var CONSENT_KEY = "wehad_measurement_consent";

  function getConsent() {
    try {
      var v = localStorage.getItem(CONSENT_KEY);
      return v === "granted" || v === "denied" ? v : null;
    } catch (e) { return null; }
  }
  function setConsent(v) {
    try { localStorage.setItem(CONSENT_KEY, v); } catch (e) {}
  }

  // نقطة ربط القياس: بتبعت للـ dataLayer (GTM) ولـ Meta Pixel لو متركّبين، وبعد الموافقة بس
  function track(event, params) {
    if (getConsent() !== "granted") return;
    params = params || {};
    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push(Object.assign({ event: event }, params));
    if (typeof window.fbq === "function") window.fbq("trackCustom", event, params);
  }

  var toastEl = document.getElementById("toast");
  var toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 2600);
  }

  document.querySelectorAll(".btn").forEach(function (a, i) {
    a.addEventListener("click", function () {
      track("wehad_link_click", { link_name: a.dataset.name, link_position: i + 1, link_url: a.href });
    });
  });

  document.getElementById("share").addEventListener("click", async function () {
    track("wehad_share_click");
    var url = location.href;
    try {
      if (navigator.share) {
        await navigator.share({ title: "وهاد", text: "بين اللحظة وحلاها", url: url });
        return;
      }
      await navigator.clipboard.writeText(url);
      toast("تم نسخ رابط الصفحة");
    } catch (e) {
      if (e && e.name === "AbortError") return;
      toast("تعذّر المشاركة، انسخي الرابط من شريط العنوان");
    }
  });

  var sheet = document.getElementById("sheet");
  var opener = document.getElementById("privacy-open");
  var currentEl = document.getElementById("sheet-current");
  function openSheet() {
    var c = getConsent();
    currentEl.hidden = !c;
    if (c) currentEl.textContent = "اختيارك الحالي: " + (c === "granted" ? "السماح بالقياس" : "الضروري فقط");
    sheet.hidden = false;
    sheet.querySelector(".primary").focus();
  }
  function closeSheet() {
    if (sheet.hidden) return;
    sheet.hidden = true;
    opener.focus();
  }
  opener.addEventListener("click", openSheet);
  document.getElementById("sheet-close").addEventListener("click", closeSheet);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSheet(); });
  sheet.querySelectorAll("[data-choice]").forEach(function (b) {
    b.addEventListener("click", function () {
      var choice = b.dataset.choice;
      setConsent(choice);
      closeSheet();
      if (choice === "granted") {
        track("wehad_measurement_consent", { consent: "granted" });
        track("wehad_page_view");
        toast("تم تمكين القياس، شكرًا لك");
      } else {
        toast("تم حفظ اختيارك: الضروري فقط");
      }
    });
  });

  track("wehad_page_view");
</script>
</body>
</html>
